# OwnCA — Dev Environment
#
# Builds from source. Code mounted for live-reload.
#
# Usage:
#   cd dev_env
#   docker compose up -d --build
#   open https://localhost:8444  (login: admin / admin)
#
# First start: PostgreSQL init + PKI generation + Django migrations (~60s).
#
# NOTE: every object in this stack is namespaced under `gh_ownca` — project
# `gh_ownca`, containers `gh_ownca_dev_*`, network + volumes `gh_ownca_*` — so
# it can NEVER collide with another `dev_env/` stack on the host. Without an
# explicit project name Compose derives it from the parent directory
# (`dev_env`), and two `dev_env/` stacks would silently share the same
# `dev_env_*` network and volumes (incl. `dev_env_pg_data`).

name: gh_ownca

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────
  gh_ownca_dev_postgresql:
    image: postgres:16
    container_name: gh_ownca_dev_postgresql
    restart: unless-stopped
    networks:
      - devnet
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ownca -d ownca"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Nginx with GOST TLS ───────────────────────────────────────────
  gh_ownca_dev_nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: gh_ownca_dev_nginx
    restart: unless-stopped
    networks:
      - devnet
    ports:
      - "8444:8444"
    volumes:
      - certs:/etc/nginx/certs
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/openssl-gost.cnf:/etc/ssl/openssl.cnf:ro
    depends_on:
      gh_ownca_dev_dashboard:
        condition: service_started

  # ── OwnCA Dashboard (code mounted for live-reload) ──────────────
  gh_ownca_dev_dashboard:
    build:
      context: ../
      dockerfile: dev_env/dashboard/Dockerfile
    container_name: gh_ownca_dev_dashboard
    networks:
      - devnet
    ports:
      - "8001:8001"
    environment:
      DB_HOST: "gh_ownca_dev_postgresql"
      DB_PORT: "5432"
      DB_NAME: "ownca"
      DB_USER: "ownca"
      DB_PASSWORD: "ownca"
      DASHBOARD_ADMIN_USER: "admin"
      DASHBOARD_ADMIN_PASSWORD: "admin"
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "*"
      CSRF_TRUSTED_ORIGINS: "http://127.0.0.1:8001,http://localhost:8001,https://127.0.0.1:8444,https://localhost:8444"
      # The app defaults to Secure session cookies. Port 8001 is plain HTTP by
      # design (direct-to-Django debugging), so a Secure cookie is dropped as
      # soon as the stack is reached over anything but loopback. Dev only —
      # demo/ and any real deployment keep the default.
      DJANGO_SECURE_COOKIES: "False"
      OWNCA_PROJECT_TITLE: "${OWNCA_PROJECT_TITLE:-Own Certificate Authority}"
      OWNCA_STORAGE_DIR: "/var/lib/ownca"
      BIND_ADDRESS: "0.0.0.0:8001"
      # --- CryptoPro CSP (certified GOST backend) ---
      # Only has effect if the image was built WITH CryptoPro (dev_env/build.sh
      # staged the distribution). Off by default; flip to "True" to route GOST
      # ops to CryptoPro. License blank => built-in 90-day demo.
      OWNCA_CRYPTOPRO_ENABLED: "${OWNCA_CRYPTOPRO_ENABLED:-False}"
      OWNCA_CRYPTOPRO_LICENSE: "${OWNCA_CRYPTOPRO_LICENSE:-}"
      OWNCA_CRYPTOPRO_GAMMA_DIR: "/var/opt/cprocsp/dsrf"
    volumes:
      - ../ownca_dashboard:/opt/app
      - ownca_data:/var/lib/ownca
      - ./crls:/var/lib/ownca/crls
      # Persist CryptoPro key containers + DRBG gamma pools across restarts.
      - cryptopro_keys:/var/opt/cprocsp/keys
      - cryptopro_gamma:/var/opt/cprocsp/dsrf
    depends_on:
      gh_ownca_dev_postgresql:
        condition: service_healthy

networks:
  devnet:
    name: gh_ownca_devnet
    driver: bridge

volumes:
  pg_data:
    name: gh_ownca_pg_data
  ownca_data:
    name: gh_ownca_data
  certs:
    name: gh_ownca_certs
  cryptopro_keys:
    name: gh_ownca_cryptopro_keys
  cryptopro_gamma:
    name: gh_ownca_cryptopro_gamma
